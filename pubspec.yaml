name: fassenger
description: "Fassenger - private family chat."
publish_to: "none"
version: 0.2.1+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Router
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.1
  google_sign_in: ^7.2.0

  # Media / avatars
  image_picker: ^1.1.2
  image: ^4.3.0

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.20.2
  logger: ^2.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

  # Codegen
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#E85D4A"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 23
  ios: false
  macos:
    generate: true
    image_path: assets/icon/icon.png
